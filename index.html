<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid solar dryer prototypes</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6ECE9;--ink:#16212A;--muted:#55636E;--line:#C6D0CC;--card:#F8FAF8;--btn:#16212A;--btnInk:#F6F8F7;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12181D;--ink:#E7EDEA;--muted:#98A6AF;--line:#33414B;--card:#1B232A;--btn:#E7EDEA;--btnInk:#12181D;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,sans-serif}
main{width:min(560px,90vw)}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:40px;line-height:1.05;margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
a,.soon{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;margin-bottom:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-decoration:none;font-size:18px}
a:hover{border-color:var(--ink)}
a span,.soon span{font-size:14px;color:var(--muted)}
.soon{opacity:.6}
</style>
</head>
<body>
<main>
<h1>Autonomous hybrid solar dryer</h1>
<p>2026/27 final year group project, Mechanical and Mechatronics Engineering, AATU Ibadan</p>
<a href="/v1">Version 1 <span>Interactive 3D prototype</span></a>
<div class="soon">Version 2 <span>In progress</span></div>
</main>
</body>
</html>
